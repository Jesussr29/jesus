<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="./css/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <section class="perfil-container">

        <h2>Mi Perfil</h2>

        <div class="foto-perfil">
            <img src="./img/ico.jpg" alt="Foto de perfil" id="previewFoto">
            <label for="inputFoto" class="btn-cambiar-foto">
                <i class="fa-solid fa-camera"></i>
            </label>
            <input type="file" id="inputFoto" hidden>
        </div>

        <form class="form-perfil" id="form-perfil">

            <div class="campo">
                <label>Nombre</label>
                <input type="text" placeholder="Tu nombre" id="inputNombre">
            </div>

            <div class="campo">
                <label>Correo</label>
                <input type="email" placeholder="Tu correo" id="inputCorreo">
            </div>

            <button type="submit" class="btn-guardar">
                <i class="fa-solid fa-floppy-disk"></i> Guardar cambios
            </button>

        </form>

    </section>

    <footer class="footer-juego" id="footerJuego">
        <a href="./index.html" class="item-footer">
            <i class="fa-solid fa-house"></i>
            <span>Inicio</span>
        </a>

        <a href="./friends.html" class="item-footer">
            <i class="fa-solid fa-user-group"></i>
            <span>Amigos</span>
        </a>

        <a href="./perfil.html" class="item-footer activo">
            <i class="fa-solid fa-user"></i>
            <span>Perfil</span>
        </a>
    </footer>


</body>

    <script src="./js/perfil.js"></script>

</html>
