<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/admin.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

    <script src="registro-sw.js"></script>
    <script type="module" src="firebase.js"></script>

<body>

    <h1>PANEL DE ADMINISTRACIÓN</h1>

    <div class="tabla-contenedor">
        <table id="tablaUsuarios">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Tag</th>
                    <th>Nivel</th>
                    <th>Experiencia</th>
                    <th>Vidas</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>


    <!-- FOOTER DE ACCIONES -->

    <footer class="footer-juego">
        <a href="./index.html" class="item-footer">
            <i class="fa-solid fa-house"></i>
            <span>Inicio</span>
        </a>

        <a href="./friends.html" class="item-footer">
            <i class="fa-solid fa-user-group"></i>
            <span>Amigos</span>
        </a>

        <a href="./perfil.html" class="item-footer">
            <i class="fa-solid fa-user"></i>
            <span>Perfil</span>
        </a>
    </footer>

    <!-- MODAL ENVIAR PUSH -->
    <div id="modalPush" class="modal">
        <div class="modal-contenido">
            <h2>Enviar notificación</h2>

            <input type="hidden" id="usuarioIdPush">

            <label>Título</label>
            <input type="text" id="tituloPush" placeholder="Título">

            <label>Mensaje</label>
            <textarea id="textoPush" placeholder="Escribe el mensaje"></textarea>

            <div class="botones-modal">
                <button onclick="enviarPush()">Enviar</button>
                <button onclick="cerrarModalPush()">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="./js/admin.js"></script>
</body>

</html>
