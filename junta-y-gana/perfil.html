<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil — Junta y Gana</title>
    <link rel="stylesheet" href="./css/perfil.css">
    <link rel="stylesheet" href="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css)">
    <link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)">
    <link rel="preconnect" href="[fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
    <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap)" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <section class="perfil-container">

        <!-- Cabecera decorativa -->
        <div class="perfil-header">
            <div class="header-bg"></div>
            <h2 class="titulo-perfil">
                <i class="fa-solid fa-user-astronaut"></i> Mi Perfil
            </h2>
            <p class="subtitulo-perfil">Personaliza tu cuenta y mantén tus datos al día</p>
        </div>

        <!-- Tarjeta principal -->
        <div class="perfil-card">

            <!-- Foto de perfil -->
            <div class="foto-perfil">
                <div class="anillo-foto">
                    <img src="./img/ico.jpg" alt="Foto de perfil" id="previewFoto">
                </div>
                <label for="inputFoto" class="btn-cambiar-foto" title="Cambiar foto">
                    <i class="fa-solid fa-camera"></i>
                </label>
                <input type="file" id="inputFoto" accept="image/*" hidden>
            </div>

            <!-- Info rápida (nivel / experiencia) -->
            <div class="info-rapida" id="infoRapida">
                <div class="chip-info">
                    <i class="fa-solid fa-star"></i>
                    <span>Nivel <strong id="chipNivel">—</strong></span>
                </div>
                <div class="chip-info">
                    <i class="fa-solid fa-bolt"></i>
                    <span><strong id="chipExp">—</strong> XP</span>
                </div>
                <div class="chip-info">
                    <i class="fa-solid fa-heart"></i>
                    <span><strong id="chipVidas">—</strong> Vidas</span>
                </div>
            </div>

            <!-- Formulario -->
            <form class="form-perfil" id="form-perfil">

                <div class="campo">
                    <label for="inputNombre">
                        <i class="fa-solid fa-id-badge"></i> Nombre
                    </label>
                    <div class="input-wrapper">
                        <input type="text" placeholder="Tu nombre" id="inputNombre" autocomplete="name">
                    </div>
                </div>

                <div class="campo">
                    <label for="inputCorreo">
                        <i class="fa-solid fa-envelope"></i> Correo electrónico
                    </label>
                    <div class="input-wrapper">
                        <input type="email" placeholder="tucorreo@ejemplo.com" id="inputCorreo" autocomplete="email">
                    </div>
                </div>

                <button type="submit" class="btn-guardar">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Guardar cambios</span>
                </button>

                <button type="button" class="btn-cerrar-sesion" onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Cerrar sesión</span>
                </button>

            </form>

        </div>

    </section>

    <footer class="footer-juego" id="footerJuego">
        <a href="./index.html" class="item-footer">
            <i class="fa-solid fa-house"></i>
            <span>Inicio</span>
        </a>

        <a href="./friends.html" class="item-footer">
            <i class="fa-solid fa-user-group"></i>
            <span>Amigos</span>
        </a>

        <a href="./perfil.html" class="item-footer activo">
            <i class="fa-solid fa-user"></i>
            <span>Perfil</span>
        </a>
    </footer>

    <script src="./js/perfil.js"></script>

</body>

</html>
