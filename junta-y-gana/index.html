<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Block Puzzle</title>
    <link rel="stylesheet" href="./css/estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./img/ico.jpg">
    <link rel="apple-touch-icon" sizes="180x180" href="./img/ico.jpg">
    <link rel="manifest" href="manifest.json">

</head>

<body>

    <script src="registro-sw.js"></script>
    <script type="module" src="firebase.js"></script>


    <!-- Cabecera con vidas y ajustes -->
    <header id="cabecera">
        <div id="vidas">
            <span id="contador-vidas"></span>
            <span id="nvidas" class="nvidas">5</span>
            <span id="tiempo-siguiente-vida"></span>
        </div>
        <div class="btn-usuario">
            <button id="btn-ajustes"><i class="fas fa-cog"></i></button>

        </div>
    </header>

    <!-- Contenedor principal -->
    <main>

        <!-- Camino de niveles -->
        <div id="camino-niveles">

        </div>


        <!-- Modal de amigos -->


        <!-- Modal de ajustes -->
        <div id="modal-ajustes">
            <div class="contenido">
                <h2>Ajustes</h2>
                <div class="opcion">
                    <label for="modo-oscuro">Modo oscuro</label>
                    <input type="checkbox" id="modo-oscuro">
                </div>

                <!-- Botón para cerrar sesión -->
                <button id="btn-cerrar-sesion">Cerrar sesión</button>

                <!-- Botón para cerrar el modal (X arriba a la derecha) -->
                <span class="cerrar-ajustes">&times;</span>

            </div>
        </div>

        <!-- Modal Bloqueado -->
        <div id="modal-bloqueado" class="modal-bloqueado">
            <div class="modal-bloqueado-contenido">
                <span id="cerrar-modal-bloqueado" class="cerrar-boton">&times;</span>
                <h2>Nivel Bloqueado</h2>
                <p>No puedes jugar este nivel aún. ¡Sigue avanzando para desbloquearlo!</p>
                <button id="cerrar-boton-bloqueado" class="btn-cerrar">Aceptar</button>
            </div>
        </div>

        <!-- Modal de notificaciones -->
        <div class="modal-notificaciones" id="modalNotificaciones">
            <div class="modal-notificaciones-contenido">
                <h2>¿Quieres recibir notificaciones?</h2>
                <p>Activa las notificaciones para recibir alertas sobre tus vidas y novedades del juego 🎮</p>
                <div class="botones-modal">
                    <button id="btn-noti-si" class="btn-activar">Sí, activar</button>
                    <button id="btn-noti-no" class="btn-cancelar">No, gracias</button>
                </div>
            </div>
        </div>

        <footer class="footer-juego" id="footerJuego">
            <a href="#" class="item-footer activo">
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </a>

            <a href="./friends.html" class="item-footer">
                <i class="fa-solid fa-user-group"></i>
                <span>Amigos</span>
            </a>

            <a href="./perfil.html" class="item-footer">
                <i class="fa-solid fa-user"></i>
                <span>Perfil</span>
            </a>
        </footer>



    </main>


    <script src="./js/juego.js"></script>

</body>

</html>
